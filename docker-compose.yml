services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rubbish:${DB_PASSWORD}@db:5432/rubbish
    ports:
      - "8000:8000"

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rubbish
      POSTGRES_USER: rubbish
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubbish -d rubbish"]
      interval: 5s
      timeout: 5s
      retries: 10
